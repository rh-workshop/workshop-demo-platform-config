# Task de ESCANEO: analiza la imagen con ACS (roxctl) y corta el pipeline.
#
# Dos puertas complementarias, en dos pasos separados:
#   1. scan-vulnerabilities: escaneo de CVEs con umbral de severidad PARAMETRIZADO
#      (nunca cableado): si hay vulnerabilidades en o por encima del umbral, FALLA.
#   2. check-build-policies: evalúa las políticas de ACS de ciclo BUILD (incluida
#      la que exige firma cosign verificada) y FALLA si alguna con enforcement viola.
#
# Se escanea por DIGEST (el mismo que se despliega), no por tag.
# El acceso a Central se crea FUERA de Git (nunca se versiona) con:
#   token de rol "Continuous Integration" desde Central (Integrations > API Token)
#   oc create secret generic acs-pipeline-credentials -n <ns> \
#     --from-literal=rox-api-token=<token> --from-file=ca.pem=<CA de Central>
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-scan
spec:
  params:
    # Referencia completa por digest, p. ej. quay.example.com/company-dev/api-service@sha256:...
    - {name: image-ref, type: string}
    # Umbral: LOW, MODERATE, IMPORTANT o CRITICAL. Marca qué CVEs se destacan en el informe y, si fail-on-violation es "true", cuáles cortan.
    - {name: severity-threshold, type: string, default: CRITICAL}
    # "false" (por defecto) INFORMA y continúa; "true" corta el pipeline al cruzar el umbral.
    # Informar sin cortar evita que CVEs de base sin parche dejen el pipeline en rojo permanente,
    # a cambio de que una imagen vulnerable SÍ se promocione: en producción esto debe ir en "true".
    - {name: fail-on-violation, type: string, default: "false"}
    # Endpoint de Central; por defecto el Service interno del cluster.
    - {name: rox-central-endpoint, type: string, default: "central.stackrox.svc:443"}
  workspaces:
    # Secret acs-pipeline-credentials: rox-api-token (rol Continuous Integration) + ca.pem de Central.
    - name: acs-credentials
  # Volumen compartido entre los dos pasos para el resultado JSON del escaneo.
  volumes:
    - {name: scan-results, emptyDir: {}}
  # Cotas de recursos: la documentacion de Tekton las exige en cada step. Sin
  # limite, un build puede agotar la memoria del nodo y tumbar otros workloads;
  # y en un namespace con LimitRange el pod no arranca si no las declara.
  stepTemplate:
    computeResources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities: {drop: [ALL]}
    volumeMounts:
      - {name: scan-results, mountPath: /var/scan}
  steps:
    - name: scan-vulnerabilities
      # roxctl en la MISMA versión que Central (evita desajustes de API).
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:4.11.3
      script: |
        #!/usr/bin/env sh
        set -eu
        ROXCTL="roxctl --token-file $(workspaces.acs-credentials.path)/rox-api-token --ca $(workspaces.acs-credentials.path)/ca.pem -e $(params.rox-central-endpoint)"
        # --force pide a Central re-escanear en vez de servir un resultado cacheado.
        $ROXCTL image scan --image "$(params.image-ref)" --force --output json > /var/scan/scan.json
        # El JSON de roxctl 4.11 trae un bloque result.summary con los conteos oficiales.
        # La imagen roxctl no trae python3 ni jq: se acota PRIMERO el bloque "summary"
        # con sed y se cuenta dentro de él — así el conteo no depende del orden global
        # del fichero (un grep posicional leería otro campo si roxctl reordena el JSON).
        RESUMEN=$(sed -n '/"summary"/,/}/p' /var/scan/scan.json)
        if [ -z "$RESUMEN" ]; then
          echo "ERROR: el JSON del escaneo no trae bloque summary (¿cambió el formato de roxctl?)." >&2
          exit 1
        fi
        contar() { printf '%s\n' "$RESUMEN" | grep -m1 -oE "\"$1\": *[0-9]+" | grep -oE '[0-9]+' || echo 0; }
        CRITICAL=$(contar CRITICAL); IMPORTANT=$(contar IMPORTANT); MODERATE=$(contar MODERATE); LOW=$(contar LOW)
        # Reporte DETALLADO en los logs: sin el listado, un recuento agregado no
        # deja decidir si las vulnerabilidades son asumibles ni cómo corregirlas.
        # Segunda pasada en formato tabla; lee del cache de Central, no re-escanea.
        echo "---------- CVEs encontrados ----------"
        $ROXCTL image scan --image "$(params.image-ref)" --output table 2>/dev/null || \
          echo "(no se pudo renderizar la tabla; el JSON completo queda en el artefacto scan.json)"
        echo "--------------------------------------"
        echo "Vulnerabilidades: CRITICAL=$CRITICAL IMPORTANT=$IMPORTANT MODERATE=$MODERATE LOW=$LOW"
        # El umbral es un PARÁMETRO del pipeline: se suma todo lo que esté en el nivel del umbral o por encima.
        case "$(params.severity-threshold)" in
          CRITICAL)  TOTAL=$CRITICAL;  NIVELES="CRITICAL" ;;
          IMPORTANT) TOTAL=$((CRITICAL + IMPORTANT)); NIVELES="CRITICAL|IMPORTANT" ;;
          MODERATE)  TOTAL=$((CRITICAL + IMPORTANT + MODERATE)); NIVELES="CRITICAL|IMPORTANT|MODERATE" ;;
          LOW)       TOTAL=$((CRITICAL + IMPORTANT + MODERATE + LOW)); NIVELES="CRITICAL|IMPORTANT|MODERATE|LOW" ;;
          *) echo "Umbral desconocido: $(params.severity-threshold) (usa LOW|MODERATE|IMPORTANT|CRITICAL)" >&2; exit 1 ;;
        esac
        if [ "$TOTAL" -gt 0 ]; then
          # Se repiten SOLO las que cruzan el umbral: son las accionables, y
          # buscarlas dentro de la tabla completa cuesta tiempo.
          # Las claves reales del JSON de roxctl 4.11 son cveId y cveSeverity (en líneas consecutivas).
          echo "----- Vulnerabilidades que cruzan el umbral $(params.severity-threshold) -----"
          # sort -u colapsa el mismo CVE repetido por cada componente afectado (validado contra el JSON real de roxctl 4.11.3).
          grep -E '"cveId"|"cveSeverity"' /var/scan/scan.json | paste - - \
            | grep -E "\"($NIVELES)\"" | sort -u | head -40 || true
          echo "Escaneo completo en la consola de ACS."
          if [ "$(params.fail-on-violation)" = "true" ]; then
            echo "FALLO: $TOTAL vulnerabilidades en severidad >= $(params.severity-threshold); la imagen no se promociona." >&2
            exit 1
          fi
          # Modo informe: se avisa pero la imagen sigue su curso hasta Git.
          echo "AVISO: $TOTAL vulnerabilidades en severidad >= $(params.severity-threshold)."
          echo "El pipeline CONTINÚA porque fail-on-violation=false; ponlo en \"true\" para que corte."
        else
          echo "Escaneo limpio en el umbral $(params.severity-threshold)."
        fi
    - name: check-build-policies
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:4.11.3
      script: |
        #!/usr/bin/env sh
        set -eu
        ROXCTL="roxctl --token-file $(workspaces.acs-credentials.path)/rox-api-token --ca $(workspaces.acs-credentials.path)/ca.pem -e $(params.rox-central-endpoint)"
        # Evalúa las políticas BUILD de ACS (p. ej. la firma cosign exigida): sale distinto de cero si alguna viola.
        # El exit code de roxctl mezcla dos causas distintas y hay que separarlas:
        #   - VIOLACIÓN de política: la evaluación SÍ corrió (hay tabla de resultados); en modo informe se avisa y se continúa.
        #   - ERROR de infraestructura (token caducado, CA errónea, Central caído): NO hubo evaluación; el pipeline corta SIEMPRE, aunque fail-on-violation=false.
        # Sin pipefail en sh POSIX un "| tee" enmascararía el exit code de roxctl: se escribe a fichero y se vuelca después.
        RC=0
        $ROXCTL image check --image "$(params.image-ref)" > /var/scan/check.log 2>&1 || RC=$?
        cat /var/scan/check.log
        if [ "$RC" -ne 0 ]; then
          # La tabla de resultados solo aparece si Central llegó a evaluar las políticas.
          if ! grep -qiE 'POLICY.*SEVERITY|violated' /var/scan/check.log; then
            echo "ERROR de infraestructura: roxctl no pudo evaluar las políticas (revisa token, CA y endpoint de Central)." >&2
            exit "$RC"
          fi
          if [ "$(params.fail-on-violation)" = "true" ]; then
            echo "FALLO: hay políticas de ACS en violación; la imagen no se promociona." >&2
            exit "$RC"
          fi
          echo "AVISO: hay políticas de ACS en violación. El pipeline CONTINÚA porque fail-on-violation=false."
        fi
