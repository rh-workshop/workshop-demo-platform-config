# Definiciones de los pipelines (CI y CD separados) y la identidad que los ejecuta.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount-builder.yaml
  - rolebinding-builder-pipelines-scc.yaml
  # Pruebas unitarias ANTES de construir, una task POR LENGUAJE con contrato común
  # (el pipeline elige por el parámetro language); todas manejan el caso "sin tests".
  - task-dotnet-test.yaml
  - task-java-test.yaml
  - task-python-test.yaml
  - task-go-test.yaml
  # Deteccion de secretos en arbol e historial de Git (gitleaks); falla cerrado.
  - task-secret-scan.yaml
  # Analisis estatico del CODIGO, antes de construir: encuentra lo que el escaneo
  # de imagen no ve (defectos escritos por el equipo, no CVEs de dependencias).
  - task-code-scan.yaml
  # Politicas DEPLOY de ACS sobre el overlay renderizado, antes de promocionar el digest.
  - task-deployment-check.yaml
  - task-image-sign.yaml
  - task-manifest-validate.yaml
  - task-image-scan.yaml
  - task-sbom-generate.yaml
  # Agente IA de triage de CVE (propone, no decide): lee el escaneo, prioriza por
  # explotabilidad y escribe un triage.md. Aislamiento out-of-process: la
  # NetworkPolicy corta egress salvo Central+modelo; correr el TaskRun con
  # runtimeClassName kata (sandboxed containers). Ver docs/ai-agents-devsecops-design.md.
  - task-agent-cve-triage.yaml
  - networkpolicy-agent-cve-triage.yaml
  # KataConfig: operando de OpenShift sandboxed containers (el operador lo instala
  # ACM). Activa la RuntimeClass kata que aisla el KERNEL del pod del agente.
  - kataconfig.yaml
  # Comprueba que lo desplegado RESPONDE: Healthy en Argo no implica alcanzable.
  - task-smoke-test.yaml
  - task-argocd-sync.yaml
  - pipeline-ci-build-image.yaml
  - pipeline-cd-deploy-application.yaml
  - pipeline-promote-image.yaml
  - pipeline-validate-manifests.yaml
  # Pipelines as Code: el CI lo dispara el evento de Git, no una persona.
  - repository-pipelines-as-code.yaml
