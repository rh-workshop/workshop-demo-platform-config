# Task de DETECCIÓN DE SECRETOS: escanea el repositorio con gitleaks ANTES del build.
#
# POR QUÉ NO BASTA CON SEMGREP: el SAST analiza el árbol de trabajo del commit
# clonado; un token commiteado ayer y "borrado" hoy sigue en el HISTORIAL de Git
# y cualquiera que clone el repo lo recupera con un git log -p. Por eso esta task
# escanea el historial COMPLETO (gitleaks git recorre todos los commits), lo que
# exige que el clone del CI sea completo (DEPTH=0), no shallow.
#
# FALLA CERRADO POR DEFECTO (fail-on-violation=true), al contrario que el SAST y
# el escaneo de CVEs: un CVE sin parche se gestiona con excepciones; un secreto
# filtrado NO admite "informar y seguir" — ya está comprometido y hay que rotarlo.
# El único remedio real es rotar la credencial Y reescribir el historial.
#
# ELECCIÓN DE IMAGEN, documentada porque rompe la norma "solo Red Hat": no existe
# detector de secretos en registry.redhat.io. Se usa gitleaks (MIT), ESPEJADO en
# el Quay corporativo y fijado por versión, nunca tirando de ghcr.io en tiempo de
# build — mismo criterio que semgrep (code-scan-task) y syft (sbom-generate-task).
# Espejado (una vez, por quien gobierna el registro):
#   skopeo copy docker://ghcr.io/gitleaks/gitleaks:v8.29.1 \
#     docker://<QUAY_HOST>/company-tooling/gitleaks:v8.29.1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: secret-scan
spec:
  params:
    # Imagen de gitleaks espejada en el registro corporativo, fijada por versión.
    - {name: scanner-image, type: string}
    # "true" (por defecto) CORTA el pipeline si hay secretos: esta puerta falla cerrado.
    # Solo se baja a "false" para triage puntual de falsos positivos, nunca en producción.
    - {name: fail-on-violation, type: string, default: "true"}
  workspaces:
    # Repositorio ya clonado (clone COMPLETO: el historial es lo que se escanea).
    - name: source
  results:
    # Número de hallazgos, para que el pipeline lo publique en su resumen.
    - {name: findings, type: string, description: Secretos detectados en el árbol y el historial}
  # Cotas de recursos: la documentacion de Tekton las exige en cada step. Sin
  # limite, un build puede agotar la memoria del nodo y tumbar otros workloads;
  # y en un namespace con LimitRange el pod no arranca si no las declara.
  stepTemplate:
    computeResources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
  steps:
    - name: gitleaks-scan
      image: $(params.scanner-image)
      workingDir: $(workspaces.source.path)
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: {drop: [ALL]}
      env:
        # HOME escribible para la config de git (el pod corre con UID aleatorio de OpenShift).
        - {name: HOME, value: /tmp}
      script: |
        #!/usr/bin/env sh
        set -eu
        # El clone lo hizo otro UID: sin safe.directory, git (y gitleaks git) se niega a leer el repo.
        git config --global --add safe.directory "$(workspaces.source.path)"

        # Aviso temprano si el clone llegó shallow: el escaneo "pasaría" mirando un solo commit.
        if [ -f .git/shallow ]; then
          echo "ERROR: el clone es shallow; el historial no está y el escaneo sería decorativo." >&2
          echo "El paso clone-source-code del CI debe clonar con DEPTH=0 (clone completo)." >&2
          exit 1
        fi

        echo "Escaneo de secretos (árbol de trabajo + historial completo de Git)"
        # --exit-code 42 separa HALLAZGO (42) de ERROR de infraestructura (cualquier otro
        # código): un error de la herramienta corta SIEMPRE, también con fail-on-violation=false.
        # --redact: los logs del pipeline no deben convertirse en el segundo punto de fuga.
        RC=0
        gitleaks git . --redact --exit-code 42 \
          --report-format json --report-path /tmp/gitleaks.json -v || RC=$?

        if [ "$RC" -ne 0 ] && [ "$RC" -ne 42 ]; then
          echo "ERROR de infraestructura: gitleaks no pudo completar el escaneo (código $RC)." >&2
          exit "$RC"
        fi

        # El recuento sale del informe JSON: es el dato que se publica como result.
        HALLAZGOS=$(grep -o '"RuleID"' /tmp/gitleaks.json 2>/dev/null | wc -l | tr -d ' ')
        printf '%s' "${HALLAZGOS}" > $(results.findings.path)
        echo "Secretos detectados: ${HALLAZGOS}"

        if [ "$RC" -eq 42 ]; then
          if [ "$(params.fail-on-violation)" = "true" ]; then
            echo "FALLO: hay secretos en el repositorio; el pipeline se corta." >&2
            echo "Remedio: ROTAR la credencial afectada y reescribir el historial; borrar el fichero no basta." >&2
            exit 1
          fi
          echo "AVISO: hay secretos pero fail-on-violation=false; el pipeline continúa (solo triage, nunca en producción)."
        else
          echo "Sin secretos detectados."
        fi
