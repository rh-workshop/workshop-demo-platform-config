# Pipeline de CI: construye, FIRMA, ESCANEA, ETIQUETA y promociona la imagen.
#
# Es la mitad "integración" del flujo: toma el CÓDIGO (repo de aplicación),
# construye la imagen, la publica en el registro, y luego escribe el digest en
# el repo de CONFIGURACIÓN. Ese git push lo recoge el auto-sync de Argo CD.
#
# Cadena de suministro, en secciones separadas y con puertas:
#   PUERTA DE CÓDIGO (paralela, ANTES del build): tests unitarios (go-test),
#     detección de secretos en árbol e historial (secret-scan, falla cerrado) y
#     SAST (code-scan) miran el MISMO código clonado y corren en paralelo; el
#     tagging y el build esperan a que las TRES pasen — puerta única.
#   TAGGING: la construcción publica el tag ANCLA de la imagen, el INMUTABLE
#     git-<sha-corto> (trazabilidad commit -> imagen). No hay tags móviles: nadie
#     los consumía y un tag que se reapunta deja digests huérfanos que Quay purga.
#     Si el tag ya existe en el registro, el pipeline NO reconstruye (idempotencia):
#     reconstruir el mismo commit produce OTRO digest, el tag se movería y el digest
#     anterior quedaría sin referencia — Quay lo recolecta y el rollback por Git muere.
#     El despliegue va SIEMPRE por DIGEST: los tags pueden reapuntarse y no son
#     reproducibles; el digest identifica criptográficamente el binario exacto.
#   VERSIONADO GitFlow: además del ancla git-<sha>, la RAMA clonada deriva un tag
#     de VERSIÓN legible (alias del MISMO digest, nunca otro build):
#       feature/* y PRs  -> solo git-<sha7> (efímero, como siempre)
#       develop          -> <version>-SNAPSHOT-<sha7>
#       release/X.Y.Z    -> X.Y.Z-rc<n> (n = siguiente rc libre en el registro)
#       tag vX.Y.Z (main)-> X.Y.Z (semver limpio)
#     <version> sale del fichero VERSION en la raíz del repo de aplicación; si no
#     existe, del parámetro `version`. Ver resolve-image-tags y apply-version-tag.
#   FIRMA: image-sign firma el digest con cosign (formato clásico .sig, el que
#     ACS descubre); complementa la atestación in-toto de Tekton Chains.
#   ESCANEO: image-scan corta el pipeline si hay CVEs sobre el umbral (parámetro)
#     o si alguna política BUILD de ACS con enforcement viola (firma exigida...);
#     deployment-check evalúa además el overlay RENDERIZADO contra las políticas
#     DEPLOY de ACS antes de promocionar el digest al repo de configuración.
#
# Maneja los DOS repos: lee el de aplicación, escribe en el de configuración.
# Este flujo promociona a DEV con push directo; hacia PROD la promoción se hace
# vía Pull Request sobre el overlay de prod, nunca con push directo.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-build-image
spec:
  params:
    - {name: app-repo, default: "https://github.com/rh-workshop/workshop-demo-app.git"}
    - {name: config-repo, default: "https://github.com/rh-workshop/workshop-demo-app-config.git"}
    - {name: revision, default: main}
    # Rama del repo de configuración que se clona y a la que se promociona el digest.
    - {name: config-revision, default: main}
    # Cómo llega el digest al repo de configuración: "direct" empuja a la rama;
    # "pr" publica una rama para que alguien revise y mezcle.
    #
    # DEV va en "direct" a propósito: es el ambiente de trabajo, se despliega en
    # cada commit y exigir una revisión ahí solo añade fricción sin proteger nada
    # (el aislamiento de features ya lo dan los previews por PR).
    # A TEST, PROD y CONTINGENCIA NO se llega por este pipeline sino por
    # `promote-image`, que además exige firma y procedencia. Este "pr" existe
    # para quien quiera revisión también en el camino a dev, o para un cliente
    # cuya normativa exija que ningún cambio entre a Git sin revisar.
    - {name: config-push-mode, default: "direct"}
    # Repositorio de la imagen SIN tag (p. ej. quay.example.com/company-dev/demo-service): los tags los decide el pipeline.
    - name: image-repository
    - {name: containerfile, default: ./Containerfile}
    - {name: overlay-path, default: apps/demo-service/overlays/dev}
    # Nombre LÓGICO de la imagen en el kustomization (campo images[].name), no la URL del registro.
    - {name: image-name, default: app-workshop}
    # Argumentos de construcción (--build-arg) para el Containerfile del monorepo, p. ej. ["APP=api-service"].
    - {name: build-args, type: array, default: []}
    # Umbral de severidad del escaneo (LOW|MODERATE|IMPORTANT|CRITICAL): el corte es un parámetro, nunca cableado.
    - {name: scan-severity-threshold, default: CRITICAL}
    # "false" informa de los CVEs y sigue; "true" corta el pipeline. En producción va en "true".
    - {name: scan-fail-on-violation, default: "false"}
    # Endpoint de ACS Central; por defecto el Service interno del cluster.
    - {name: rox-central-endpoint, default: "central.stackrox.svc:443"}
    # Analizador SAST espejado en el registro corporativo (nunca desde Docker Hub en
    # tiempo de build): ver la cabecera de task-code-scan.yaml para el skopeo copy.
    - {name: sast-scanner-image, default: "CHANGE_ME_QUAY_HOST/company-tooling/semgrep:1.79.0"}
    # "false" informa de los hallazgos y sigue; "true" corta. En producción va en "true".
    - {name: sast-fail-on-violation, default: "false"}
    # Lenguaje de la aplicación (dotnet|java|python|go): elige la TASK de pruebas
    # <language>-test vía el resolver cluster — una task por lenguaje, cada una con
    # su imagen Red Hat fijada; el pipeline es único y la selección es un dato.
    - {name: language, default: "go"}
    # Subdirectorio del monorepo que prueban los tests unitarios; "." = la raíz.
    - {name: test-context, default: "."}
    # "false" (hoy no hay tests): la ausencia de tests informa y sigue; "true" la convierte en obligatoria.
    - {name: fail-on-no-tests, default: "false"}
    # VERSIÓN del runtime que ejecuta las pruebas. Vacío = la imagen Red Hat que la plataforma
    # soporta para ese lenguaje (ver la task resolve-test-image). Una app que necesite otra
    # —JDK 21 en vez de 25, .NET 8 en vez de 10— la fija en SU PipelineRun: queda en Git y pasa
    # por PR. Por eso hay UNA task por lenguaje y no una por versión.
    - {name: test-image, default: ""}
    # Detector de secretos espejado en el registro corporativo (tercera excepción a
    # "solo Red Hat", junto a semgrep y syft): ver la cabecera de task-secret-scan.yaml.
    - {name: secret-scanner-image, default: "CHANGE_ME_QUAY_HOST/company-tooling/gitleaks:v8.29.1"}
    # Generador de SBOM, tambien espejado en el registro corporativo.
    - {name: sbom-scanner-image, default: "CHANGE_ME_QUAY_HOST/company-tooling/syft:v1.19.0"}
    # "true" por defecto: un secreto filtrado corta SIEMPRE; no admite "informar y seguir".
    - {name: secrets-fail-on-violation, default: "true"}
    # Versión base para los tags GitFlow cuando el repo NO trae fichero VERSION en la raíz.
    - {name: version, default: "0.1.0"}
    # "false" informa de violaciones DEPLOY sobre el overlay renderizado y sigue; "true" corta.
    - {name: deploy-check-fail-on-violation, default: "false"}
  workspaces:
    - name: source
    - name: config
    - name: git-credentials
    # Secret con config.json del robot del registro (push de imagen, firma y guarda de idempotencia).
    - name: registry-credentials
    # Secret cosign-signing-key (cosign.key/cosign.pub/password) generado con cosign generate-key-pair k8s://...
    - name: signing-key
    # Secret acs-pipeline-credentials (rox-api-token + ca.pem de Central) para roxctl.
    - name: acs-credentials
  results:
    - name: image-digest
      value: $(tasks.resolve-digest.results.image-digest)
    # Los results de Pipeline solo admiten results de tasks (no params): la referencia completa es <image-repository>@<image-digest>.
    - name: immutable-tag
      value: $(tasks.resolve-image-tags.results.immutable-tag)
    # Tag de versión GitFlow (alias del mismo digest); igual al inmutable en ramas efímeras.
    - name: version-tag
      value: $(tasks.resolve-image-tags.results.version-tag)
  tasks:
    - name: clone-source-code
      # Un reintento absorbe los fallos transitorios de red contra el repositorio remoto.
      retries: 1
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.app-repo)}
        - {name: REVISION, value: $(params.revision)}
        # Clone COMPLETO (no shallow): secret-scan escanea el HISTORIAL de Git; con el default (1 commit) el escaneo sería decorativo.
        - {name: DEPTH, value: "0"}
      workspaces: [{name: output, workspace: source}]
      # La puerta de código se encadena aquí: tests, secretos y SAST cuelgan del
      # clone en PARALELO, y el resto del pipeline cuelga de los tres a la vez.

    # --- PUERTA DE CÓDIGO: tests, secretos y SAST, en PARALELO y ANTES del build ---
    # Los tres controles miran el MISMO código recién clonado y no dependen entre
    # sí: serializarlos solo sumaría minutos. Van aquí, no después del build,
    # porque si el código no pasa no tiene sentido gastar tiempo construyendo ni
    # publicar un artefacto que habría que retirar. El tagging (y con él el build)
    # espera a los TRES: puerta única.

    # Pruebas unitarias con cobertura; hoy el repo no tiene tests y la task lo
    # informa sin romper (fail-on-no-tests=false) — lista para cuando los haya.
    # La task se resuelve por NOMBRE a partir del lenguaje ($(params.language)-test,
    # en el namespace del run): mismo pipeline para .NET, Java, Python y Go, sin
    # duplicarlo ni ramificar con `when` — las cuatro tasks comparten contrato
    # (test-image propio, context, fail-on-no-tests, result coverage).
    # Resuelve la imagen EFECTIVA de las pruebas: el override de la aplicación si viene, o la
    # imagen soportada para su lenguaje. El mapa es el catálogo de la plataforma: dar soporte a una
    # versión nueva es editar SOLO este case, sin tocar las tasks ni los PipelineRun de las apps.
    #
    # Se resuelve aquí y no dentro de la task porque el campo `image` de un step admite parámetros
    # pero NO resultados de otro step: la imagen se fija al crear el pod, antes de ejecutar nada.
    # A nivel de pipeline sí puede pasarse el resultado de una task a otra, que es lo que se hace.
    - name: resolve-test-image
      params:
        - {name: language, value: $(params.language)}
        - {name: override, value: $(params.test-image)}
      taskSpec:
        params:
          - {name: language, type: string}
          - {name: override, type: string}
        results:
          - {name: image, type: string, description: Imagen de runtime que ejecutará las pruebas}
        steps:
          - name: resolve
            image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [ -n "$(params.override)" ]; then
                IMG="$(params.override)"
                echo "La aplicación fija su propia imagen de pruebas."
              else
                # Estas imágenes deben coincidir con el default de cada <lenguaje>-test-task.
                case "$(params.language)" in
                  java)   IMG="registry.access.redhat.com/ubi9/openjdk-25:1.24" ;;
                  dotnet) IMG="registry.access.redhat.com/ubi9/dotnet-100:9.8" ;;
                  python) IMG="registry.access.redhat.com/ubi9/python-312:1-1762230134" ;;
                  go)     IMG="registry.redhat.io/ubi9/go-toolset:1.26.7" ;;
                  *) echo "ERROR: no hay imagen soportada para el lenguaje '$(params.language)'." >&2; exit 1 ;;
                esac
              fi
              printf '%s' "${IMG}" > $(results.image.path)
              echo "Imagen de pruebas: ${IMG}"

    - name: run-unit-tests
      runAfter: [clone-source-code]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: "$(params.language)-test"}, {name: namespace, value: "$(context.pipelineRun.namespace)"}]}
      params:
        - {name: test-image, value: $(tasks.resolve-test-image.results.image)}
        - {name: context, value: $(params.test-context)}
        - {name: fail-on-no-tests, value: $(params.fail-on-no-tests)}
      workspaces: [{name: source, workspace: source}]

    # Detección de secretos en árbol E HISTORIAL (gitleaks). Falla CERRADO por
    # defecto: un secreto commiteado ya está comprometido y solo cabe rotarlo.
    - name: detect-secrets
      runAfter: [clone-source-code]
      taskRef: {name: secret-scan}
      params:
        - {name: scanner-image, value: $(params.secret-scanner-image)}
        - {name: fail-on-violation, value: $(params.secrets-fail-on-violation)}
      workspaces: [{name: source, workspace: source}]

    # SAST: encuentra lo que image-scan NO ve — defectos escritos por el equipo
    # (inyección, cripto débil), no CVEs de dependencias empaquetadas.
    - name: scan-source-code
      runAfter: [clone-source-code]
      taskRef: {name: code-scan}
      params:
        - {name: scanner-image, value: $(params.sast-scanner-image)}
        - {name: fail-on-violation, value: $(params.sast-fail-on-violation)}
      workspaces: [{name: source, workspace: source}]

    # --- SECCIÓN TAGGING: deriva el tag inmutable del commit REAL clonado y
    # aplica la IDEMPOTENCIA: si git-<sha> ya existe en el registro, el commit ya
    # tiene su imagen y NO se reconstruye — se reutiliza el digest existente y el
    # pipeline continúa (firma, escaneo y promoción sí corren sobre ese digest).
    # Reconstruir daría OTRO digest (los builds no son reproducibles bit a bit),
    # el tag se re-apuntaría y el digest anterior quedaría huérfano: Quay lo
    # purga y todo commit del repo de config que lo referencie pierde el rollback.
    # Además del ancla, deriva el TAG DE VERSIÓN GitFlow de la rama clonada (ver
    # cabecera): un ALIAS legible del mismo digest que aplica apply-version-tag.
    - name: resolve-image-tags
      runAfter: [run-unit-tests, detect-secrets, scan-source-code]
      params:
        - {name: commit, value: $(tasks.clone-source-code.results.COMMIT)}
        - {name: image-repository, value: $(params.image-repository)}
        - {name: revision, value: $(params.revision)}
        - {name: version, value: $(params.version)}
      workspaces:
        - {name: registry-credentials, workspace: registry-credentials}
        # El código clonado: de ahí sale el fichero VERSION si el repo lo trae.
        - {name: source, workspace: source}
      taskSpec:
        params:
          - {name: commit, type: string}
          - {name: image-repository, type: string}
          - {name: revision, type: string}
          - {name: version, type: string}
        workspaces:
          - name: registry-credentials
          - name: source
        results:
          # Tag inmutable git-<sha-corto>: nunca se reutiliza ni se mueve. Es el ANCLA de la idempotencia.
          - name: immutable-tag
          # Digest ya publicado bajo ese tag, o el centinela "none" si hay que construir.
          - name: existing-digest
          # Tag de versión GitFlow derivado de la rama; igual al inmutable en ramas efímeras.
          - name: version-tag
        steps:
          - name: compute-and-check-tag
            image: registry.redhat.io/rhel9/skopeo:9.8
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              AUTH="$(workspaces.registry-credentials.path)/config.json"
              SHORT=$(printf '%s' "$(params.commit)" | cut -c1-7)
              TAG="git-${SHORT}"
              EXISTING="none"
              LISTA=""
              # Se listan los tags del repositorio; un repo aún no creado (primer build) no es un error.
              if SALIDA=$(skopeo list-tags --authfile "$AUTH" "docker://$(params.image-repository)" 2>&1); then
                LISTA="$SALIDA"
                if printf '%s\n' "$SALIDA" | grep -q "\"${TAG}\""; then
                  EXISTING=$(skopeo inspect --no-tags --format '{{.Digest}}' --authfile "$AUTH" "docker://$(params.image-repository):${TAG}")
                  echo "El tag ${TAG} ya existe (digest ${EXISTING}): NO se reconstruye."
                  echo "El pipeline continúa con firma, escaneo y promoción sobre ese digest."
                fi
              else
                # Repo inexistente = primer build; cualquier otro fallo (red, credencial) es de infraestructura y corta.
                case "$SALIDA" in
                  *"name unknown"*|*"NAME_UNKNOWN"*|*"repository not found"*) echo "Primer build: el repositorio aún no existe en el registro." ;;
                  *) echo "ERROR de infraestructura consultando el registro:" >&2; printf '%s\n' "$SALIDA" >&2; exit 1 ;;
                esac
              fi

              # ---- Versionado GitFlow: el tag de versión sale de la RAMA clonada ----
              # La versión base sale del fichero VERSION de la raíz del repo; si no existe, del parámetro `version`.
              BASE="$(params.version)"
              if [ -f "$(workspaces.source.path)/VERSION" ]; then
                BASE=$(tr -d ' \t\r\n' < "$(workspaces.source.path)/VERSION")
                echo "Versión base leída del fichero VERSION: ${BASE}"
              fi
              es_semver() { printf '%s' "$1" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; }
              REV="$(params.revision)"
              VTAG="$TAG"
              case "$REV" in
                develop)
                  # Rama de integración: versión-en-progreso, anclada al commit para que nunca sea ambigua.
                  VTAG="${BASE}-SNAPSHOT-${SHORT}" ;;
                release/*)
                  # La versión del rc sale del NOMBRE de la rama (release/X.Y.Z); si no es semver, del fichero VERSION.
                  REL="${REV#release/}"
                  es_semver "$REL" || REL="$BASE"
                  REL="${REL#v}"
                  RCS=$(printf '%s\n' "$LISTA" | grep -oE "\"${REL}-rc[0-9]+\"" | tr -d '"' || true)
                  # Idempotencia del rc: si el commit ya tiene imagen, se REUTILIZA el rc que apunte a su digest en vez de acuñar otro.
                  ELEGIDO=""
                  if [ "$EXISTING" != "none" ] && [ -n "$RCS" ]; then
                    for T in $RCS; do
                      D=$(skopeo inspect --no-tags --format '{{.Digest}}' --authfile "$AUTH" "docker://$(params.image-repository):${T}")
                      if [ "$D" = "$EXISTING" ]; then ELEGIDO="$T"; break; fi
                    done
                  fi
                  if [ -n "$ELEGIDO" ]; then
                    VTAG="$ELEGIDO"
                    echo "Este commit ya tiene su release candidate (${VTAG}): no se acuña otro."
                  else
                    # Siguiente rc libre: el mayor n existente en el registro, más uno.
                    MAX=0
                    for T in $RCS; do
                      N="${T##*-rc}"
                      if [ "$N" -gt "$MAX" ]; then MAX="$N"; fi
                    done
                    VTAG="${REL}-rc$((MAX + 1))"
                  fi ;;
                *)
                  # Un TAG semver de git (release desde main) produce la versión limpia; cualquier
                  # otra rama (feature/*, PRs, main sin tag) se queda con el git-<sha7> efímero.
                  if es_semver "$REV"; then VTAG="${REV#v}"; fi ;;
              esac
              if [ "$VTAG" = "$TAG" ]; then
                echo "Revisión efímera (${REV}): sin tag de versión, solo ${TAG}."
              else
                echo "Tag de versión GitFlow derivado de '${REV}': ${VTAG}"
              fi
              printf '%s' "$EXISTING" | tee $(results.existing-digest.path)
              printf 'git-%s' "$SHORT" | tee $(results.immutable-tag.path)
              printf '%s' "$VTAG" > $(results.version-tag.path)

    - name: build-and-publish-image
      runAfter: [resolve-image-tags]
      # La construcción solo corre si el commit aún no tiene imagen publicada (idempotencia).
      when:
        - input: $(tasks.resolve-image-tags.results.existing-digest)
          operator: in
          values: ["none"]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: buildah}, {name: namespace, value: openshift-pipelines}]}
      params:
        # La imagen nace YA con su tag inmutable; el digest sale como result y manda de aquí en adelante.
        - {name: IMAGE, value: "$(params.image-repository):$(tasks.resolve-image-tags.results.immutable-tag)"}
        - {name: DOCKERFILE, value: $(params.containerfile)}
        # Verificación TLS activa: el registro presenta un certificado de CA pública (validado en vivo).
        - {name: TLS_VERIFY, value: "true"}
        # El Containerfile del monorepo elige el binario con ARG APP: aquí se le pasa tal cual.
        # GIT_COMMIT viaja SIEMPRE: el Containerfile lo estampa como etiqueta OCI
        # org.opencontainers.image.revision, y como el monorepo es un único módulo Go ese
        # commit identifica también la versión exacta del código común (internal/) que
        # lleva el binario — así se sabe qué versión corre en cada imagen desplegada.
        - name: BUILD_ARGS
          value: ["$(params.build-args[*])", "GIT_COMMIT=$(tasks.clone-source-code.results.COMMIT)"]
      workspaces:
        - {name: source, workspace: source}
        # Credencial del robot para el push al registro corporativo.
        - {name: dockerconfig, workspace: registry-credentials}

    # Anota el digest del build en el workspace: un result de una task SALTADA no es
    # consumible (Tekton saltaría en cascada a quien lo refiencie), el fichero sí.
    - name: record-digest
      runAfter: [build-and-publish-image]
      when:
        - input: $(tasks.resolve-image-tags.results.existing-digest)
          operator: in
          values: ["none"]
      params:
        - {name: image-digest, value: $(tasks.build-and-publish-image.results.IMAGE_DIGEST)}
      taskSpec:
        params:
          - {name: image-digest, type: string}
        workspaces:
          - name: source
        steps:
          - name: write-digest
            image: registry.redhat.io/ubi9/ubi-minimal:9.6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              printf '%s' "$(params.image-digest)" > "$(workspaces.source.path)/.image-digest"
      workspaces:
        - {name: source, workspace: source}

    # Resuelve el digest DEFINITIVO: el del build recién hecho o el ya existente en el
    # registro; de aquí en adelante todas las tareas consumen ESTE result.
    - name: resolve-digest
      runAfter: [record-digest]
      params:
        - {name: existing-digest, value: $(tasks.resolve-image-tags.results.existing-digest)}
      taskSpec:
        params:
          - {name: existing-digest, type: string}
        workspaces:
          - name: source
        results:
          - name: image-digest
        steps:
          - name: choose-digest
            image: registry.redhat.io/ubi9/ubi-minimal:9.6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ -f "$(workspaces.source.path)/.image-digest" ]; then
                DIGEST=$(cat "$(workspaces.source.path)/.image-digest")
                echo "Digest del build de este run: ${DIGEST}"
              elif [ "$(params.existing-digest)" != "none" ]; then
                DIGEST="$(params.existing-digest)"
                echo "Build saltado por idempotencia: se reutiliza el digest ${DIGEST}"
              else
                echo "ERROR: no hay digest ni del build ni del registro." >&2
                exit 1
              fi
              printf '%s' "$DIGEST" | tee $(results.image-digest.path)
      workspaces:
        - {name: source, workspace: source}

    # --- SECCIÓN VERSIONADO: aplica el tag GitFlow como ALIAS del digest resuelto.
    # skopeo copy dentro del MISMO repositorio no reconstruye nada: añade un tag
    # que apunta al manifiesto ya publicado, conservando el digest. El interruptor
    # se evalúa DENTRO del step y no con un `when`: una task saltada arrastraría
    # por runAfter a set-image-digest y la promoción entera (trampa documentada).
    - name: apply-version-tag
      runAfter: [resolve-digest]
      params:
        - {name: image-repository, value: $(params.image-repository)}
        - {name: image-digest, value: $(tasks.resolve-digest.results.image-digest)}
        - {name: immutable-tag, value: $(tasks.resolve-image-tags.results.immutable-tag)}
        - {name: version-tag, value: $(tasks.resolve-image-tags.results.version-tag)}
      workspaces:
        - {name: registry-credentials, workspace: registry-credentials}
      taskSpec:
        params:
          - {name: image-repository, type: string}
          - {name: image-digest, type: string}
          - {name: immutable-tag, type: string}
          - {name: version-tag, type: string}
        workspaces:
          - name: registry-credentials
        steps:
          - name: tag-alias
            image: registry.redhat.io/rhel9/skopeo:9.8
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              AUTH="$(workspaces.registry-credentials.path)/config.json"
              VTAG="$(params.version-tag)"
              # Revisión efímera: el único tag es el ancla git-<sha>; no hay nada que aplicar.
              if [ "$VTAG" = "$(params.immutable-tag)" ]; then
                echo "Sin tag de versión para esta revisión; queda solo $(params.immutable-tag)."
                exit 0
              fi
              DST="docker://$(params.image-repository):${VTAG}"
              # Los tags de versión también son INMUTABLES: si ya existe apuntando a OTRO
              # digest, alguien reconstruyó una versión publicada y hay que pararlo.
              if ACTUAL=$(skopeo inspect --no-tags --format '{{.Digest}}' --authfile "$AUTH" "$DST" 2>/dev/null); then
                if [ "$ACTUAL" = "$(params.image-digest)" ]; then
                  echo "El tag ${VTAG} ya apunta a este digest; nada que hacer (idempotencia)."
                  exit 0
                fi
                echo "ERROR: el tag ${VTAG} ya existe con OTRO digest (${ACTUAL}); un tag de versión no se reapunta jamás." >&2
                exit 1
              fi
              # Alias registry-side: mismo repositorio, mismo manifiesto, digest conservado.
              skopeo copy --all --src-authfile "$AUTH" --dest-authfile "$AUTH" \
                "docker://$(params.image-repository)@$(params.image-digest)" "$DST"
              echo "Tag de versión ${VTAG} aplicado sobre el digest $(params.image-digest)."

    # --- SECCIÓN FIRMA: cosign firma el digest resuelto (formato .sig que ACS verifica).
    - name: sign-image
      runAfter: [resolve-digest]
      taskRef: {name: image-sign}
      params:
        - {name: image-repository, value: $(params.image-repository)}
        # El digest viaja como RESULT resuelto (build o registro): nunca se re-resuelve desde un tag mutable.
        - {name: image-digest, value: $(tasks.resolve-digest.results.image-digest)}
      workspaces:
        - {name: signing-key, workspace: signing-key}
        - {name: registry-credentials, workspace: registry-credentials}

    # --- SECCIÓN SBOM: inventario de dependencias atestado con la misma llave de
    # firma. Corre en PARALELO con firma y escaneo (las tres parten del digest
    # resuelto y no dependen entre sí); la promoción del digest sí la espera.
    - name: generate-sbom
      runAfter: [resolve-digest]
      taskRef: {name: sbom-generate}
      params:
        - {name: scanner-image, value: $(params.sbom-scanner-image)}
        - {name: image-repository, value: $(params.image-repository)}
        - {name: image-digest, value: $(tasks.resolve-digest.results.image-digest)}
      workspaces:
        - {name: registry-credentials, workspace: registry-credentials}
        - {name: signing-key, workspace: signing-key}

    # --- SECCIÓN ESCANEO: corre tras la firma para que la política BUILD "firma exigida" pueda verificarla.
    - name: scan-image
      runAfter: [sign-image]
      taskRef: {name: image-scan}
      params:
        - {name: image-ref, value: "$(params.image-repository)@$(tasks.resolve-digest.results.image-digest)"}
        - {name: severity-threshold, value: $(params.scan-severity-threshold)}
        - {name: fail-on-violation, value: $(params.scan-fail-on-violation)}
        - {name: rox-central-endpoint, value: $(params.rox-central-endpoint)}
      workspaces:
        - {name: acs-credentials, workspace: acs-credentials}

    - name: clone-config-repo
      # Corre en paralelo con firma y escaneo: solo prepara el clon; la promoción espera a las puertas.
      runAfter: [build-and-publish-image]
      # Un reintento absorbe los fallos transitorios de red contra el repositorio remoto.
      retries: 1
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.config-repo)}
        - {name: REVISION, value: $(params.config-revision)}
      workspaces: [{name: output, workspace: config}]

    # Evalúa el overlay RENDERIZADO contra las políticas DEPLOY de ACS: el control
    # sobre los MANIFIESTOS (privilegios, límites, montajes), no sobre el binario.
    - name: check-deploy-manifests
      runAfter: [clone-config-repo]
      taskRef: {name: deployment-check}
      params:
        - {name: overlay-path, value: $(params.overlay-path)}
        - {name: fail-on-violation, value: $(params.deploy-check-fail-on-violation)}
        - {name: rox-central-endpoint, value: $(params.rox-central-endpoint)}
      workspaces:
        - {name: config, workspace: config}
        - {name: acs-credentials, workspace: acs-credentials}

    # Promociona el digest con "kustomize edit set image": entiende la semántica del
    # kustomization (no corrompe overlays con varias imágenes, como haría un sed) y el
    # "*" conserva el newName existente a la vez que elimina el newTag.
    # Espera al ESCANEO, al SBOM, al CHEQUEO DE MANIFIESTOS y al TAG DE VERSIÓN: al repo
    # de configuración solo llegan digests firmados, limpios, evaluados y versionados.
    - name: set-image-digest
      runAfter: [clone-config-repo, scan-image, generate-sbom, check-deploy-manifests, apply-version-tag]
      params:
        - {name: overlay-path, value: $(params.overlay-path)}
        - {name: image-name, value: $(params.image-name)}
        - {name: image-digest, value: $(tasks.resolve-digest.results.image-digest)}
      taskSpec:
        params:
          - {name: overlay-path, type: string}
          - {name: image-name, type: string}
          - {name: image-digest, type: string}
        workspaces:
          - name: config
        steps:
          - name: kustomize-set-image
            # La imagen de Argo CD del operador GitOps ya instalado trae kustomize y git: no hace falta traer nada nuevo al cluster.
            image: registry.redhat.io/openshift-gitops-1/argocd-rhel9:1.21
            workingDir: $(workspaces.config.path)/$(params.overlay-path)
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              kustomize edit set image "$(params.image-name)=*@$(params.image-digest)"
              echo "Overlay actualizado:" && cat kustomization.yaml

    - name: push-config
      runAfter: [set-image-digest]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-cli}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: GIT_USER_NAME, value: "pipeline-ci"}
        - {name: GIT_USER_EMAIL, value: "pipeline-ci@ejemplo.local"}
        # La task git-cli borra el workspace entero antes de correr (DELETE_EXISTING vale "true" por defecto): hay que apagarlo o pierde el clon de la tarea anterior.
        - {name: DELETE_EXISTING, value: "false"}
        - name: GIT_SCRIPT
          value: |
            set -eu
            # El workspace se monta en rutas distintas según la task que lo use
            # (git-clone lo llama "output" y git-cli "source"), así que se parte
            # de la ruta que declara ESTA task en vez de asumir el directorio.
            cd $(workspaces.source.path)
            # Se añade SOLO el fichero tocado: un "commit -a" arrastraría cualquier otro cambio del workspace.
            git add $(params.overlay-path)/kustomization.yaml
            # Sin cambios (mismo digest) no hay nada que promocionar: se sale con éxito.
            if git diff --cached --quiet; then
              echo "El overlay ya apunta a este digest; no se promociona nada."
              exit 0
            fi
            DIGEST="$(tasks.resolve-digest.results.image-digest)"
            git commit -m "ci: promote $(params.image-name) to digest ${DIGEST}"

            # PUSH DIRECTO vs RAMA PARA PR. El push directo a la rama de config es
            # cómodo pero se salta la revisión: cualquier fallo del CI llega al
            # ambiente sin que nadie lo mire, y con auto-sync se despliega solo.
            # Con "pr" el CI empuja una RAMA y deja que un humano (o una regla de
            # protección) decida el merge — que es lo que recomienda Argo CD:
            # promocionar por Pull Request, nunca editando el fichero compartido.
            if [ "$(params.config-push-mode)" = "pr" ]; then
              # La rama lleva el digest corto: dos ejecuciones distintas nunca
              # colisionan, y el nombre dice qué promociona sin abrir el diff.
              RAMA="ci/promote-$(params.image-name)-$(printf '%s' "${DIGEST}" | cut -c8-19)"
              # --force sobre SU propia rama: reejecutar el mismo commit reescribe
              # su rama, no la de otro (el nombre incluye el digest).
              if git push --force origin "HEAD:refs/heads/${RAMA}"; then
                echo "Rama publicada: ${RAMA}"
                echo "Abre el Pull Request hacia $(params.config-revision) para promocionar."
                exit 0
              fi
              echo "No se pudo publicar la rama ${RAMA}." >&2
              exit 1
            fi

            # Reintento con rebase: si otro PipelineRun empujó antes, el push sería non-fast-forward.
            # git-clone deja el repo en detached HEAD: hay que calificar la rama destino.
            for intento in 1 2 3; do
              if git push origin HEAD:$(params.config-revision); then
                exit 0
              fi
              echo "Push rechazado (intento ${intento}): se rebasa sobre el remoto y se reintenta."
              git fetch origin $(params.config-revision)
              git rebase FETCH_HEAD
            done
            echo "No se pudo empujar tras 3 intentos." >&2
            exit 1
      workspaces:
        - {name: source, workspace: config}
        - {name: basic-auth, workspace: git-credentials}

  # El resumen corre SIEMPRE (finally), incluso si una puerta cortó el pipeline: deja en el log qué pasó cada sección.
  finally:
    - name: pipeline-summary
      params:
        - {name: tests-status, value: $(tasks.run-unit-tests.status)}
        - {name: secrets-status, value: $(tasks.detect-secrets.status)}
        - {name: sast-status, value: $(tasks.scan-source-code.status)}
        - {name: build-status, value: $(tasks.build-and-publish-image.status)}
        - {name: version-status, value: $(tasks.apply-version-tag.status)}
        - {name: sign-status, value: $(tasks.sign-image.status)}
        - {name: sbom-status, value: $(tasks.generate-sbom.status)}
        - {name: scan-status, value: $(tasks.scan-image.status)}
        - {name: manifests-status, value: $(tasks.check-deploy-manifests.status)}
        - {name: promote-status, value: $(tasks.push-config.status)}
      taskSpec:
        params:
          - {name: tests-status, type: string}
          - {name: secrets-status, type: string}
          - {name: sast-status, type: string}
          - {name: build-status, type: string}
          - {name: version-status, type: string}
          - {name: sign-status, type: string}
          - {name: sbom-status, type: string}
          - {name: scan-status, type: string}
          - {name: manifests-status, type: string}
          - {name: promote-status, type: string}
        steps:
          - name: report
            image: registry.redhat.io/ubi9/ubi-minimal:9.6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              echo "===== Resumen del pipeline ====="
              echo "Tests        : $(params.tests-status)"
              echo "Secretos     : $(params.secrets-status)"
              echo "SAST         : $(params.sast-status)"
              echo "Construcción : $(params.build-status)"
              echo "Tag versión  : $(params.version-status)"
              echo "Firma        : $(params.sign-status)"
              echo "SBOM         : $(params.sbom-status)"
              echo "Escaneo      : $(params.scan-status)"
              echo "Manifiestos  : $(params.manifests-status)"
              echo "Promoción    : $(params.promote-status)"
