# Politica de seguridad de ACS COMO CODIGO (GitOps), no por API.
#
# En ACS 4.11 las politicas SI tienen CRD (SecurityPolicy), reconciliado por el
# config-controller de Central. Por eso van aqui, versionadas y sincronizadas por
# Argo, en vez de por un playbook imperativo.
#
# Esta politica detecta contenedores que corren como usuario root.
# Correr como no-root (runAsNonRoot / runAsUser distinto de 0) limita el impacto de
# un compromiso del proceso; en OpenShift el SCC restricted-v2 ya lo favorece.
# enforcementActions VACIA = modo INFORM: en produccion bancaria se observa primero.
# Para bloquear en admision, agregar FAIL_DEPLOYMENT_CREATE/UPDATE_ENFORCEMENT y SCALE_TO_ZERO_ENFORCEMENT.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: run-as-non-root
  namespace: stackrox
spec:
  policyName: Contenedor corre como root
  description: Un contenedor que corre como usuario root amplia el impacto de un compromiso del proceso; debe ejecutarse como usuario no privilegiado.
  severity: MEDIUM_SEVERITY
  categories:
    - Security Best Practices
  lifecycleStages:
    - DEPLOY
  enforcementActions: []
  policySections:
    # No existe "Run as Privileged User" como fieldName en 4.11. El contenedor que
    # corre como root se detecta con "Image User" = 0 o root, patron de la built-in
    # "Docker CIS 4.1: Ensure That a User for the Container Has Been Created".
    - sectionName: Regla principal
      policyGroups:
        - fieldName: Image User
          booleanOperator: OR
          values:
            - value: "0"
            - value: "root"
