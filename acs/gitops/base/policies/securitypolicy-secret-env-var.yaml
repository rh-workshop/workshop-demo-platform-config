# Politica de seguridad de ACS COMO CODIGO (GitOps), no por API.
#
# En ACS 4.11 las politicas SI tienen CRD (SecurityPolicy), reconciliado por el
# config-controller de Central. Por eso van aqui, versionadas y sincronizadas por
# Argo, en vez de por un playbook imperativo.
#
# Esta politica detecta secretos en claro en variables de entorno cuyo NOMBRE
# sugiere material sensible (SECRET, PASSWORD, TOKEN). Los secretos deben venir de
# un Secret montado (o de ESO/Key Vault), nunca embebidos en el manifiesto del pod.
# El fieldName "Environment Variable" usa el formato RAW "fuente=CLAVE=VALOR";
# aqui se usa regex en la clave y source RAW para env vars con valor literal.
# enforcementActions VACIA = modo INFORM: en produccion bancaria se observa primero.
# Para bloquear en admision, agregar FAIL_DEPLOYMENT_CREATE/UPDATE_ENFORCEMENT y SCALE_TO_ZERO_ENFORCEMENT.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: secret-env-var
  namespace: stackrox
spec:
  policyName: Secreto en variable de entorno
  description: Una variable de entorno cuyo nombre sugiere material sensible (SECRET, PASSWORD, TOKEN) expone credenciales en claro; deben venir de un Secret montado, no del manifiesto.
  severity: HIGH_SEVERITY
  categories:
    - Security Best Practices
  lifecycleStages:
    - DEPLOY
  enforcementActions: []
  policySections:
    - sectionName: Regla principal
      policyGroups:
        # "Environment Variable" usa formato RAW "source=key=value"; regex en la clave detecta nombres sensibles.
        # VERIFICAR fieldName/valor contra la consola ACS 4.11 (Policy Management > Environment Variable): confirmar prefijo de source (RAW=) y sintaxis del value.
        - fieldName: Environment Variable
          booleanOperator: OR
          values:
            - value: RAW=.*SECRET.*=.*
            - value: RAW=.*PASSWORD.*=.*
            - value: RAW=.*TOKEN.*=.*
