# Politica de seguridad de ACS COMO CODIGO (GitOps), no por API.
#
# En ACS 4.11 las politicas SI tienen CRD (SecurityPolicy), reconciliado por el
# config-controller de Central. Por eso van aqui, versionadas y sincronizadas por
# Argo, en vez de por un playbook imperativo.
#
# Esta politica detecta curl o wget en la imagen: herramientas de descarga que un
# atacante usa para traer payloads o exfiltrar datos, y que casi nunca hacen falta en
# tiempo de ejecucion de un microservicio.
# enforcementActions VACIO = modo INFORM: observamos primero. Para forzar en BUILD se
# agrega FAIL_BUILD_ENFORCEMENT.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: curl-wget-in-image
  namespace: stackrox
spec:
  policyName: curl o wget presentes en la imagen
  description: Una imagen con curl o wget facilita descargar payloads o exfiltrar datos y rara vez es necesaria en ejecucion.
  severity: LOW_SEVERITY
  categories:
    - Security Best Practices
  lifecycleStages:
    - BUILD
  # enforcementActions vacio a proposito: modo INFORM. Para enforce agregar FAIL_BUILD_ENFORCEMENT.
  enforcementActions: []
  policySections:
    - sectionName: Herramientas de descarga en la imagen
      policyGroups:
        - fieldName: Image Component
          booleanOperator: OR
          values:
            - value: "curl"
            - value: "wget"
