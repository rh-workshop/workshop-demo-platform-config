# Politica de seguridad de ACS COMO CODIGO (GitOps), no por API.
#
# En ACS 4.11 las politicas SI tienen CRD (SecurityPolicy), reconciliado por el
# config-controller de Central. Por eso van aqui, versionadas y sincronizadas por
# Argo, en vez de por un playbook imperativo.
#
# Esta politica detecta imagenes cuyo ultimo escaneo es viejo (o inexistente).
# Un escaneo antiguo no refleja los CVEs recien publicados: la imagen puede tener
# vulnerabilidades conocidas que ACS aun no "ve". Se exige un escaneo reciente.
# enforcementActions VACIA = modo INFORM: en produccion bancaria se observa primero.
# Para bloquear en admision, agregar FAIL_DEPLOYMENT_CREATE/UPDATE_ENFORCEMENT y SCALE_TO_ZERO_ENFORCEMENT.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: image-scanned
  namespace: stackrox
spec:
  policyName: Imagen con escaneo viejo o sin escanear
  description: Una imagen con escaneo antiguo o inexistente puede ocultar CVEs recientes; se exige un escaneo reciente antes de desplegar.
  severity: MEDIUM_SEVERITY
  categories:
    - Vulnerability Management
  lifecycleStages:
    - DEPLOY
  enforcementActions: []
  policySections:
    - sectionName: Regla principal
      policyGroups:
        # "Image Scan Age" es criterio de comparacion; el value es la antiguedad maxima tolerada en dias (aqui 30).
        # VERIFICAR fieldName/valor contra la consola ACS 4.11 (Policy Management > Image Scan Age): confirmar nombre y unidad del value (dias).
        - fieldName: Image Scan Age
          values:
            - value: "30"
